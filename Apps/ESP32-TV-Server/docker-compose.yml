name: esp32-tv-server
services:
  esp32-tv-server:
    image: ghcr.io/drhammadkhan/esp32-tv-cyd-rtsp-server:latest
    container_name: esp32-tv-server
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 8124
        published: "8124"
        protocol: tcp
    environment:
      VIDEO_SERVER_PORT: "8124"
      RTSP_URL: "rtsp://user:pass@camera:8554/Streaming/Channels/102"
      JPEG_QUALITY: "76"
      SWAP_RB: "0"
      CONTRAST: "1.14"
      BRIGHTNESS: "-6"
      SATURATION: "1.22"
      STREAM_PRESET: "balanced"
    volumes:
      - type: bind
        source: /DATA/AppData/${AppID:-esp32-tv-server}/movies
        target: /app/movies
      - type: bind
        source: /DATA/AppData/${AppID:-esp32-tv-server}/cache
        target: /app/cache
    labels:
      icon: https://raw.githubusercontent.com/drhammadkhan/esp32-tv-cyd-rtsp/main/Apps/ESP32-TV-Server/icon.svg
    x-casaos:
      ports:
        - container: "8124"
          description:
            en_us: "Web UI + ESP32 stream API"
      volumes:
        - container: /app/movies
          description:
            en_us: "Optional local MP4 source files for movie mode."
        - container: /app/cache
          description:
            en_us: "Video preprocessing cache."
x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  author: drhammadkhan
  category: Media
  description:
    en_us: |
      WiFi/RTSP video backend for ESP32 CYD devices.
      Includes live tuning UI at /admin and stream endpoints used by the firmware.
      Supports RTSP bridge mode and local movie mode.
  developer: drhammadkhan
  icon: https://raw.githubusercontent.com/drhammadkhan/esp32-tv-cyd-rtsp/main/Apps/ESP32-TV-Server/icon.svg
  index: /admin
  main: esp32-tv-server
  port_map: "8124"
  project_url: https://github.com/drhammadkhan/esp32-tv-cyd-rtsp
  store_app_id: esp32-tv-server
  tagline:
    en_us: "RTSP/movie streaming backend for ESP32 CYD with live tuning UI."
  thumbnail: https://raw.githubusercontent.com/drhammadkhan/esp32-tv-cyd-rtsp/main/Apps/ESP32-TV-Server/icon.svg
  tips:
    before_install:
      en_us: |
        Default Web/API port is 8124.
        Update RTSP_URL after install from the web UI at /admin.
        Firmware USB flashing from /admin is disabled in container runtime.
  title:
    en_us: ESP32 TV Server
