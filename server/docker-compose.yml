services:
  esp32-tv-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esp32-tv-server
    ports:
      - "8124:8124"
    environment:
      VIDEO_SERVER_PORT: "8124"
      RTSP_URL: "rtsp://user:pass@camera:8554/Streaming/Channels/102"
      JPEG_QUALITY: "76"
      SWAP_RB: "0"
      CONTRAST: "1.14"
      BRIGHTNESS: "-6"
      SATURATION: "1.22"
      STREAM_PRESET: "balanced"
    volumes:
      - ./movies:/app/movies
      - ./cache:/app/cache
    restart: unless-stopped
